[package]
name = "Operating_System"
version = "0.1.0"
edition = "2024"


[dependencies]
#x86_64 = "0.15"
uart_16550 = "0.6.0"
bootloader = {version="0.9", features=["map_physical_memory"]}
volatile = "0.2.6"
spin = "0.5.2"
pic8259 = "0.10.1"
pc-keyboard = "0.9.0"
linked_list_allocator = "0.9.0"



[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]


[dependencies.x86_64]
version = "0.15"
features = ["abi_x86_interrupt"]


[package.metadata.bootimage]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio", "-display", "none"]
test-success-exit-code = 33
#[profile.release]
#panic = "abort"

#[profile.dev]
#panic = "abort"


[[bin]]
name="Operating_System"
test=true
bench=false

[[test]]
name="should_panic"
harness=false

[[test]]
name="stack_overflow"
harness=false
        

[[test]]
name="basic_boot"
harness=true
